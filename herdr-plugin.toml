id = "sid.console"
name = "SID Console"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "技能庫、Agent 團隊與專案主控台（本機、唯讀）"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "開啟 SID 主控台"
contexts = ["global", "workspace"]
command = ["python3", "-m", "sidconsole", "launch"]

[[actions]]
id = "rescan"
title = "SID 主控台：重新掃描技能"
contexts = ["global"]
command = ["python3", "-m", "sidconsole", "scan"]
