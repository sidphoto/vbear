name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: macos-latest
    # v0.17.0: the Python 3.14 job reached the old 20-minute limit while the frontend tests were still to run; the whole suite takes about 20 minutes on a Mac
    # v0.20.0: about 5,860 tests take about 33 minutes on a Mac and passed 35 on a runner, so the limit is 60
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Backend tests
        run: python -m unittest discover -s tests
      - name: Frontend tests
        run: for f in tests/frontend/*.cjs; do node "$f" || exit 1; done
