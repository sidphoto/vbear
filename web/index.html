<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBear</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>
<body>
<a class="skip" href="#main">跳到主要內容</a>
<div class="shell">

      <span class="brand-text">VBear<small>你的 AI 員工</small></span>
    </div>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-list"><span class="nav-toggle-bars" aria-hidden="true"></span><span id="nav-toggle-label">進階</span></button>
    <ul class="nav" id="nav-list">
      <li><a href="#/" data-nav="home"><span aria-hidden="true">⌂</span>首頁</a></li>
      <li><a href="#/employees" data-nav="employees"><span aria-hidden="true">◎</span>員工</a></li>
      <li><a href="#/work" data-nav="work"><span aria-hidden="true">≡</span>工作</a></li>
      <li><a href="#/settings" data-nav="settings"><span aria-hidden="true">⚙</span>設定</a></li>
      <li class="nav-sep" data-advanced hidden>進階</li>
      <li data-advanced hidden><a href="#/terminals" data-nav="terminals"><span aria-hidden="true">›_</span>指令視窗</a></li>
      <li data-advanced hidden><a href="#/workbench" data-nav="workbench"><span aria-hidden="true">⊞</span>工作台</a></li>

      <li data-advanced hidden><a href="#/team" data-nav="team"><span aria-hidden="true">☰</span>員工詳細資料</a></li>
    </ul>
    <div class="side-foot" id="scan-status" aria-live="polite" hidden></div>
  </nav>
  <div class="stage">
    <div class="waiting-bar" id="waiting-bar" role="status" aria-live="polite" hidden></div>
    <p class="advanced-note" id="advanced-note" role="note" hidden></p>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
